name: Feature request
description: Propose a focused change
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should the project solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the interface and expected behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What workarounds or other designs did you consider?
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Note effects on CLI, MCP, schemas, reports, or native engines.
