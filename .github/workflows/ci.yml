name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Go stable, Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Test with coverage
        run: go test -coverpkg=./... -covermode=atomic -coverprofile=coverage.out ./...
      - name: Enforce new-regression gate
        shell: bash
        run: |
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}"; then
            if git rev-parse --verify 'HEAD^' >/dev/null 2>&1; then
              base='HEAD^'
            else
              echo 'No parent commit is available; skipping change regression gate.'
              exit 0
            fi
          fi
          merge_base="$(git merge-base "$base" HEAD)"
          baseline="$RUNNER_TEMP/crap-baseline"
          mkdir -p "$baseline"
          git archive "$merge_base" | tar -x -C "$baseline"
          (
            cd "$baseline"
            go test -coverpkg=./... -covermode=atomic -coverprofile=coverage.out ./...
          )
          go run ./cmd/crap compare \
            --base "$base" \
            --base-coverage "$baseline/coverage.out" \
            --coverage coverage.out \
            --threshold 30 \
            --fail-on-regression \
            .
      - name: Run focused race tests
        run: go test -race ./cmd/crap ./cmd/crap-install ./cmd/crap-mutate ./internal/analysis ./internal/clioutput ./internal/installer ./internal/mcpserver ./internal/mutation ./internal/mutationmcp ./internal/rootauth ./internal/sarif
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test npx bootstrap
        run: |
          npm test
          npx --yes . --help
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  compatibility:
    name: Go 1.25 (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            os: ubuntu-24.04
          - name: macOS amd64
            os: macos-15-intel
          - name: Windows amd64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.x
          cache: true
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
      - name: Test npx bootstrap
        run: |
          npm test
          npx --yes . --help
